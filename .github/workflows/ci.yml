name: CI

# This repository had no CI at all: no workflow, so no checks, so every pull
# request here has reported "no checks" and read as green to anything that
# asks whether something is failing.
#
# The matrix below was MEASURED on this module, not copied from a sibling.
# Every pair was cross-built locally first; the blanks are pairs the Go
# toolchain does not have (there is no darwin/riscv64), not pairs that were
# skipped. A matrix written from a template lands red on its first run, and a
# red lane nobody reads is how weft-microvm-agent kept a broken linux build
# for weeks while darwin and the BSDs went green.
#
# TWO GATES THE FLEET STANDARD ASKS FOR ARE DELIBERATELY ABSENT, because
# adding a lane that cannot pass is worse than not having it:
#
#   * 100% statement coverage. This module is protoc output plus four .proto
#     files. There are no statements of ours to cover, and a gate that can
#     never be satisfied teaches people to ignore red.
#
#   * "the checked-in stubs match the .proto files". This is the gate that
#     actually matters here, and it is missing because it cannot be pinned
#     honestly yet: the stubs were generated by protoc v7.35.0 with
#     protoc-gen-go v1.36.11 (they say so in their own headers), and a gate
#     running any other protoc reports a diff that means "different
#     generator", not "stale stubs". It needs those two versions pinned in
#     the workflow AND a regeneration step in whatever bumps them. Until
#     that exists, this file does not pretend to check it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: gofmt -l . | tee /tmp/fmt && test ! -s /tmp/fmt
        if: matrix.os == 'ubuntu-latest'
      - run: go test -count=1 ./...

  race:
    name: race detector
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=1 ./...

  # linux carries all six architectures the fleet builds for, s390x included:
  # this module is wire format, and big-endian is where a wire format that
  # assumed the machine's byte order stops agreeing with itself.
  linux-arches:
    name: build linux/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, riscv64, loong64, ppc64le, s390x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  # The other operating systems, with the architectures each of them actually
  # has. freebsd and openbsd carry riscv64; darwin, windows and netbsd do not.
  other-oses:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, windows, freebsd, openbsd, netbsd]
        goarch: [amd64, arm64]
        include:
          - goos: freebsd
            goarch: riscv64
          - goos: openbsd
            goarch: riscv64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...
